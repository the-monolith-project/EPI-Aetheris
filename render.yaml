# Blueprint de despliegue en Render (backend + Postgres + frontend estático,
# una sola cuenta). Ver docs/despliegue-render.md para el procedimiento
# completo. El primer despliegue sigue siendo manual (aplicar el DDL +
# --bootstrap + cargar el seed contra la base gestionada: Render no tiene
# docker-entrypoint-initdb.d). Las migraciones *posteriores* las aplica
# preDeployCommand antes de conmutar trafico (issue #83).
#
# El backend y la base quedan en la misma región para hablarse por red
# privada. El sitio estático no acepta región (se sirve por CDN global).
# Plan "starter"/"basic-256mb" en backend y DB -- elegido por costo-beneficio
# (~$14/mes backend+DB), no por ser el más barato posible: ver
# docs/despliegue-render.md para la comparación frente a Railway/Fly.io/Vercel.

databases:
  - name: epi-aetheris-db
    databaseName: epi_aetheris
    user: aetheris_user
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "15"

services:
  - type: web
    name: epi-aetheris-backend
    runtime: docker
    plan: starter
    region: oregon
    # main es la rama de release: el deploy se dispara solo al mergear en
    # main (dev es integración y la rama por defecto del repo). Ver AGENTS.md
    # §15. Explícito aquí para que no dependa de la rama por defecto de GitHub.
    branch: main
    # Contexto = raiz del repo para copiar db/aplicar_migraciones.py y
    # db/migrations/ dentro de la imagen. docker-compose sigue construyendo
    # backend/Dockerfile con contexto ./backend.
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    # Dockerfile.render ya no usa --reload (ese flag es del Dockerfile de
    # compose, con bind mount). Se deja dockerCommand explicito por si el
    # Blueprint se sincroniza contra una imagen vieja.
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    # Corre en una instancia de la imagen recien construida, con las mismas
    # POSTGRES_* que el servicio, antes de conmutar trafico. Si falla, el
    # deploy no avanza y sigue viva la version anterior.
    preDeployCommand: python db/aplicar_migraciones.py
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: epi-aetheris-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: epi-aetheris-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: epi-aetheris-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: epi-aetheris-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: epi-aetheris-db
          property: password
      # Predicho como https://<name del static site>.onrender.com -- Render
      # asigna ese subdominio exacto salvo colisión de nombre (namespace
      # global de .onrender.com), en cuyo caso agrega un sufijo. Verificar
      # la URL real del servicio "epi-aetheris-web" en el dashboard tras el
      # primer deploy y corregir aquí si no coincide.
      - key: CORS_ALLOWED_ORIGINS
        value: https://epi-aetheris-web.onrender.com
      # Escritura de alertas (ADR 0015). Render lo pide en el panel; no
      # se versiona un valor. Sin él, POST/PATCH responden 503.
      - key: ALERTAS_TOKEN
        sync: false

  - type: web
    name: epi-aetheris-web
    runtime: static
    rootDir: ./web
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      # Se embebe en el bundle del cliente en build-time (variable PUBLIC_*
      # de Astro) -- por eso va como valor fijo, no como fromService: Astro
      # ya generó el HTML/JS antes de que ese lookup pudiera resolverse.
      # Mismo aviso que arriba: verificar contra la URL real de
      # "epi-aetheris-backend" tras el primer deploy.
      - key: PUBLIC_API_URL
        value: https://epi-aetheris-backend.onrender.com
